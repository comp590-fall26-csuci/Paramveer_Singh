
---
- name: Lab6 Ansible Setup
  hosts: local
  become: true

  tasks:
    - name: Install asciinema
      ansible.builtin.apt:
        name: asciinema
        state: present
        update_cache: true

    - name: Install Apache2
      ansible.builtin.apt:
        name: apache2
        state: present

    - name: Enable and start Apache2
      ansible.builtin.service:
        name: apache2
        enabled: true
        state: started

    - name: Show completion message
      ansible.builtin.debug:
        msg: "Lab6 Complete! Apache2 is installed and running."
