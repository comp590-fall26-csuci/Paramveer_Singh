name: AFL++ Fuzzing

on:
  pull_request:
    branches:
      - main

jobs:
  afl-fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create AFL seed input
        run: |
          mkdir -p seeds
          printf 'IMG\x00\x01\x00\x00\x00\x01\x00\x00\x00test' > seeds/seed

      - name: Run AFL++ for three minutes
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e AFL_SKIP_CPUFREQ=1 \
            -e AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 \
            -e AFL_NO_UI=1 \
            aflplusplus/aflplusplus:latest \
            bash -c '
              afl-clang-fast dvcp.c -o dvcp &&
              timeout -s INT 180s afl-fuzz -i seeds -o findings -- ./dvcp @@ || true
            '
